name: Flutter caregiver preview

on:
  workflow_dispatch:

permissions:
  contents: write

# Manual preview only. The production Flutter web workflow owns automatic
# main-branch publishing so two workflows never race to commit the same bundle.
concurrency:
  group: flutter-caregiver-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter web host files
        working-directory: apps/mobile
        run: |
          flutter create --platforms=web --project-name hani_maak_mobile .
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build caregiver Flutter web app
        working-directory: apps/mobile
        run: |
          flutter build web \
            --release \
            --base-href /flutter/ \
            --dart-define=HANI_API_BASE=https://hani-maak.vercel.app \
            --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Publish compiled Flutter app into the Vercel web host
        run: |
          rm -rf apps/web/public/flutter
          mkdir -p apps/web/public/flutter
          cp -R apps/mobile/build/web/. apps/web/public/flutter/

      - name: Commit compiled preview
        run: |
          if git diff --quiet -- apps/web/public/flutter; then
            echo "Flutter preview already current."
            exit 0
          fi
          git config user.name "hani-maak-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -f apps/web/public/flutter
          git commit -m "Build Flutter caregiver preview [skip flutter]"
          git push origin HEAD:main
