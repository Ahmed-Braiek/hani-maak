name: Build Hani Maak Final Demo APK

on:
  push:
    branches:
      - android-safe-demo-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hani-maak-final-demo-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --project-name hani_maak_mobile --org com.hanimaak .
          rm -f test/widget_test.dart

      - name: Configure Android notifications and widget
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              """
          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(">\n    <application", ">\n    " + permissions + "<application", 1)

          text = text.replace('android:label="hani_maak_mobile"', 'android:label="Hani Maak"')

          receivers = """
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  </intent-filter>
              </receiver>

              <receiver
                  android:name=".HaniMaakWidgetProvider"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/hani_maak_widget_info" />
              </receiver>
          """
          text = text.replace("</application>", receivers + "\n    </application>")
          manifest.write_text(text)

          drawable = Path("android/app/src/main/res/drawable/hani_notification.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@android:color/white"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5S10.5,3.17 10.5,4v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1z" />
          </vector>
          """)

          layout = Path("android/app/src/main/res/layout/hani_maak_widget.xml")
          layout.parent.mkdir(parents=True, exist_ok=True)
          layout.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="#EAF6FF">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hani Maak"
                  android:textColor="#0E61C6"
                  android:textStyle="bold"
                  android:textSize="16sp" />
              <TextView
                  android:id="@+id/widget_patient"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#12324A"
                  android:textStyle="bold"
                  android:textSize="14sp" />
              <TextView
                  android:id="@+id/widget_medication"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_appointment"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#199AED"
                  android:textStyle="bold"
                  android:textSize="12sp" />
          </LinearLayout>
          """)

          info = Path("android/app/src/main/res/xml/hani_maak_widget_info.xml")
          info.parent.mkdir(parents=True, exist_ok=True)
          info.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/hani_maak_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          """)

          provider = Path("android/app/src/main/kotlin/com/hanimaak/hani_maak_mobile/HaniMaakWidgetProvider.kt")
          provider.parent.mkdir(parents=True, exist_ok=True)
          provider.write_text("""package com.hanimaak.hani_maak_mobile

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class HaniMaakWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.hani_maak_widget)
                      views.setTextViewText(R.id.widget_patient, widgetData.getString("patient_name", "Fatma"))
                      views.setTextViewText(R.id.widget_medication, widgetData.getString("next_medication", "No medication due"))
                      views.setTextViewText(R.id.widget_appointment, widgetData.getString("next_appointment", "No upcoming appointment"))
                      val tasks = widgetData.getInt("open_tasks", 0)
                      val status = widgetData.getString("care_status", "Care plan up to date")
                      views.setTextViewText(R.id.widget_status, "$tasks open tasks · $status")
                      val launch = context.packageManager.getLaunchIntentForPackage(context.packageName)
                      if (launch != null) {
                          val pending = PendingIntent.getActivity(
                              context, 0, launch,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, pending)
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          """)

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          g = g.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
          g = g.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_11')
          if "isCoreLibraryDesugaringEnabled = true" not in g:
              g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in g:
              g += """
              
              dependencies {
                  coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              }
              """
          gradle.write_text(g)
          PY

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Align home_widget JVM target
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for path in cache.glob("home_widget-*/android/build.gradle"):
              text = path.read_text()
              text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
              text = text.replace("VERSION_1_8", "VERSION_11")
              text = text.replace("jvmTarget = '1.8'", "jvmTarget = '11'")
              text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "11"')
              text = text.replace("sourceCompatibility = 1.8", "sourceCompatibility = 11")
              text = text.replace("targetCompatibility = 1.8", "targetCompatibility = 11")
              path.write_text(text)
          PY

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release             --dart-define=HANI_API_BASE=https://hani-maak.vercel.app             --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co             --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/Hani-Maak-Final-Demo.apk
          sha256sum dist/Hani-Maak-Final-Demo.apk > dist/Hani-Maak-Final-Demo.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hani-maak-final-demo-apk
          path: |
            dist/Hani-Maak-Final-Demo.apk
            dist/Hani-Maak-Final-Demo.apk.sha256
          retention-days: 30
          if-no-files-found: error
