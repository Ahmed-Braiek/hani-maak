name: Build Hani Maak Android Voice Recovery APK

on:
  push:
    branches:
      - android-voice-recovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hani-maak-android-voice-recovery-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --project-name hani_maak_mobile --org com.hanimaak .
          rm -f test/widget_test.dart

      - name: Configure minimal Android host
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              """
          if "android.permission.RECORD_AUDIO" not in text:
              marker = ">\n    <application"
              text = text.replace(marker, ">\n    " + permissions + "<application", 1)
          text = text.replace('android:label="hani_maak_mobile"', 'android:label="Hani Maak Recovery"')
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text().replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              g = g.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
              g = g.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_11')
              gradle.write_text(g)
          PY

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build recovery release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release             --dart-define=HANI_API_BASE=https://hani-maak.vercel.app             --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co             --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Prepare recovery APK
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/Hani-Maak-Voice-Recovery.apk
          sha256sum dist/Hani-Maak-Voice-Recovery.apk > dist/Hani-Maak-Voice-Recovery.apk.sha256

      - name: Upload recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: hani-maak-voice-recovery-apk
          path: |
            dist/Hani-Maak-Voice-Recovery.apk
            dist/Hani-Maak-Voice-Recovery.apk.sha256
          retention-days: 30
          if-no-files-found: error
