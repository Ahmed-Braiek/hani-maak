name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Domain and security tests
        run: npm test

      - name: Heni deterministic evaluations
        run: npm run evals

      - name: Voice bridge syntax check
        run: npm run voice:check

      - name: Heni agent Python syntax
        run: python -m compileall -q apps/heni-agent/app apps/heni-agent/tests

      - name: Heni agent security tests
        env:
          PYTHONPATH: apps/heni-agent
        run: python -m unittest discover -s apps/heni-agent/tests -v

      - name: Production build
        run: npm run build
