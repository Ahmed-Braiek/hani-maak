name: Build Hani Maak Android APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hani-maak-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: apps/mobile
        run: |
          flutter create             --platforms=android             --project-name hani_maak_mobile             --org com.hanimaak             .
          rm -f test/widget_test.dart

      - name: Configure Android permissions and app identity
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              """

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace("<manifest xmlns:android=", "<manifest xmlns:android=", 1)
              marker = ">\n    <application"
              text = text.replace(marker, ">\n    " + permissions + "<application", 1)

          text = text.replace('android:label="hani_maak_mobile"', 'android:label="Hani Maak"')

          if "<queries>" not in text:
              queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                      <data android:scheme="tel" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>
              """
              text = text.replace("</manifest>", queries + "\n</manifest>")

          receiver = """
              <receiver
                  android:name=".HaniMaakWidgetProvider"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/hani_maak_widget_info" />
              </receiver>
          """
          if "HaniMaakWidgetProvider" not in text:
              text = text.replace("</application>", receiver + "\n    </application>")

          manifest.write_text(text)

          layout = Path("android/app/src/main/res/layout/hani_maak_widget.xml")
          layout.parent.mkdir(parents=True, exist_ok=True)
          layout.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="#EAF6FF">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hani Maak"
                  android:textColor="#0E61C6"
                  android:textStyle="bold"
                  android:textSize="16sp" />
              <TextView
                  android:id="@+id/widget_patient"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#12324A"
                  android:textStyle="bold"
                  android:textSize="14sp" />
              <TextView
                  android:id="@+id/widget_medication"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_appointment"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#199AED"
                  android:textStyle="bold"
                  android:textSize="12sp" />
          </LinearLayout>
          """)

          info = Path("android/app/src/main/res/xml/hani_maak_widget_info.xml")
          info.parent.mkdir(parents=True, exist_ok=True)
          info.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/hani_maak_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          """)

          provider = Path("android/app/src/main/kotlin/com/hanimaak/hani_maak_mobile/HaniMaakWidgetProvider.kt")
          provider.parent.mkdir(parents=True, exist_ok=True)
          provider.write_text("""package com.hanimaak.hani_maak_mobile

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class HaniMaakWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.hani_maak_widget)
                      views.setTextViewText(
                          R.id.widget_patient,
                          widgetData.getString("patient_name", "Patient")
                      )
                      views.setTextViewText(
                          R.id.widget_medication,
                          widgetData.getString("next_medication", "No medication due")
                      )
                      views.setTextViewText(
                          R.id.widget_appointment,
                          widgetData.getString("next_appointment", "No upcoming appointment")
                      )
                      val tasks = widgetData.getInt("open_tasks", 0)
                      val status = widgetData.getString("care_status", "Care plan up to date")
                      views.setTextViewText(
                          R.id.widget_status,
                          "$tasks open tasks · $status"
                      )

                      val launch = context.packageManager
                          .getLaunchIntentForPackage(context.packageName)
                      if (launch != null) {
                          val pending = PendingIntent.getActivity(
                              context,
                              0,
                              launch,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, pending)
                      }

                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          """)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(g)
          PY

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          flutter build apk             --release             --dart-define=HANI_API_BASE=https://hani-maak.vercel.app             --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co             --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Prepare team APK
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/hani-maak-team.apk
          sha256sum dist/hani-maak-team.apk > dist/hani-maak-team.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hani-maak-team-apk
          path: |
            dist/hani-maak-team.apk
            dist/hani-maak-team.apk.sha256
          retention-days: 30
          if-no-files-found: error
