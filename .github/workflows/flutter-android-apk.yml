name: Build Hani Maak Android APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hani-maak-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: apps/mobile
        run: |
          flutter create             --platforms=android             --project-name hani_maak_mobile             --org com.hanimaak             .
          rm -f test/widget_test.dart

      - name: Configure Android permissions and app identity
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              """

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace("<manifest xmlns:android=", "<manifest xmlns:android=", 1)
              marker = ">\n    <application"
              text = text.replace(marker, ">\n    " + permissions + "<application", 1)

          text = text.replace('android:label="hani_maak_mobile"', 'android:label="Hani Maak"')

          if "<queries>" not in text:
              queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                      <data android:scheme="tel" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>
              """
              text = text.replace("</manifest>", queries + "\n</manifest>")

          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(g)
          PY

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          flutter build apk             --release             --dart-define=HANI_API_BASE=https://hani-maak.vercel.app             --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co             --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Prepare team APK
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/hani-maak-team.apk
          sha256sum dist/hani-maak-team.apk > dist/hani-maak-team.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hani-maak-team-apk
          path: |
            dist/hani-maak-team.apk
            dist/hani-maak-team.apk.sha256
          retention-days: 30
          if-no-files-found: error
