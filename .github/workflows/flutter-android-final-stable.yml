name: Build Hani Maak Final Stable APK

on:
  push:
    branches:
      - android-final-stable-emotion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hani-maak-final-stable-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --project-name hani_maak_mobile --org com.hanimaak .
          rm -f test/widget_test.dart

      - name: Configure stable native Android services
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              """
          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(">\n    <application", ">\n    " + permissions + "<application", 1)

          text = text.replace('android:label="hani_maak_mobile"', 'android:label="Hani Maak"')

          receivers = """
              <receiver
                  android:name=".HaniNotificationReceiver"
                  android:exported="false" />
              <receiver
                  android:name=".HaniMaakWidgetProvider"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/hani_maak_widget_info" />
              </receiver>
          """
          if "HaniNotificationReceiver" not in text:
              text = text.replace("</application>", receivers + "\n    </application>")
          manifest.write_text(text)

          drawable = Path("android/app/src/main/res/drawable/hani_notification.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@android:color/white"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5S10.5,3.17 10.5,4v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1z" />
          </vector>
          """)

          layout = Path("android/app/src/main/res/layout/hani_maak_widget.xml")
          layout.parent.mkdir(parents=True, exist_ok=True)
          layout.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="#EAF6FF">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hani Maak"
                  android:textColor="#0E61C6"
                  android:textStyle="bold"
                  android:textSize="16sp" />
              <TextView
                  android:id="@+id/widget_patient"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#12324A"
                  android:textStyle="bold"
                  android:textSize="14sp" />
              <TextView
                  android:id="@+id/widget_medication"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_appointment"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#42647E"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/widget_status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#199AED"
                  android:textStyle="bold"
                  android:textSize="12sp" />
          </LinearLayout>
          """)

          info = Path("android/app/src/main/res/xml/hani_maak_widget_info.xml")
          info.parent.mkdir(parents=True, exist_ok=True)
          info.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/hani_maak_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          """)

          kotlin_dir = Path("android/app/src/main/kotlin/com/hanimaak/hani_maak_mobile")
          kotlin_dir.mkdir(parents=True, exist_ok=True)

          (kotlin_dir / "MainActivity.kt").write_text(r"""package com.hanimaak.hani_maak_mobile

          import android.Manifest
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.hanimaak/native"
              private var methodChannel: MethodChannel? = null
              private var pendingRoute: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  pendingRoute = intent?.getStringExtra("route")
                  methodChannel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  )
                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "initializeNotifications" -> {
                              createChannels()
                              result.success(null)
                          }
                          "getInitialNotificationRoute" -> {
                              val route = pendingRoute
                              pendingRoute = null
                              result.success(route)
                          }
                          "requestNotificationPermission" -> {
                              if (Build.VERSION.SDK_INT >= 33 &&
                                  checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                              ) {
                                  requestPermissions(
                                      arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                                      4401
                                  )
                              }
                              result.success(null)
                          }
                          "showTestNotification" -> {
                              createChannels()
                              HaniNotificationReceiver.showNotification(
                                  this,
                                  777001,
                                  call.argument<String>("title") ?: "Hani Maak",
                                  call.argument<String>("body") ?: "",
                                  call.argument<String>("route") ?: "/notifications"
                              )
                              result.success(null)
                          }
                          "scheduleNotification" -> {
                              scheduleNotification(
                                  call.argument<Int>("id") ?: 0,
                                  call.argument<String>("title") ?: "Hani Maak",
                                  call.argument<String>("body") ?: "",
                                  call.argument<Number>("whenMs")?.toLong() ?: 0L,
                                  call.argument<String>("route") ?: "/today"
                              )
                              result.success(null)
                          }
                          "updateWidget" -> {
                              val prefs = getSharedPreferences("hani_widget", Context.MODE_PRIVATE)
                              prefs.edit()
                                  .putString("patient_name", call.argument<String>("patientName") ?: "Patient")
                                  .putString("next_medication", call.argument<String>("nextMedication") ?: "No medication due")
                                  .putString("next_appointment", call.argument<String>("nextAppointment") ?: "No upcoming appointment")
                                  .putInt("open_tasks", call.argument<Int>("openTasks") ?: 0)
                                  .putString("care_status", call.argument<String>("careStatus") ?: "Care plan up to date")
                                  .apply()
                              HaniMaakWidgetProvider.refreshAll(this)
                              result.success(null)
                          }
                          "requestPinWidget" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  val manager = getSystemService(AppWidgetManager::class.java)
                                  val provider = ComponentName(this, HaniMaakWidgetProvider::class.java)
                                  if (manager.isRequestPinAppWidgetSupported) {
                                      result.success(manager.requestPinAppWidget(provider, null, null))
                                  } else {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val route = intent.getStringExtra("route")
                  if (!route.isNullOrBlank()) {
                      methodChannel?.invokeMethod("notificationRoute", route)
                  }
              }

              private fun createChannels() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val manager = getSystemService(NotificationManager::class.java)
                  manager.createNotificationChannel(
                      NotificationChannel(
                          "hani_care",
                          "Hani Maak care reminders",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "Medication, appointments and caregiver reminders."
                      }
                  )
              }

              private fun scheduleNotification(
                  id: Int,
                  title: String,
                  body: String,
                  whenMs: Long,
                  route: String
              ) {
                  if (whenMs <= System.currentTimeMillis()) return
                  val intent = Intent(this, HaniNotificationReceiver::class.java).apply {
                      putExtra("id", id)
                      putExtra("title", title)
                      putExtra("body", body)
                      putExtra("route", route)
                  }
                  val pending = PendingIntent.getBroadcast(
                      this,
                      id,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val alarm = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  alarm.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, whenMs, pending)
              }
          }
          """)

          (kotlin_dir / "HaniNotificationReceiver.kt").write_text(r"""package com.hanimaak.hani_maak_mobile

          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationCompat

          class HaniNotificationReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  showNotification(
                      context,
                      intent.getIntExtra("id", 0),
                      intent.getStringExtra("title") ?: "Hani Maak",
                      intent.getStringExtra("body") ?: "",
                      intent.getStringExtra("route") ?: "/today"
                  )
              }

              companion object {
                  fun showNotification(
                      context: Context,
                      id: Int,
                      title: String,
                      body: String,
                      route: String
                  ) {
                      val launch = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
                          putExtra("route", route)
                      }
                      val pending = PendingIntent.getActivity(
                          context,
                          id,
                          launch,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val notification = NotificationCompat.Builder(context, "hani_care")
                          .setSmallIcon(R.drawable.hani_notification)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pending)
                          .build()
                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.notify(id, notification)
                  }
              }
          }
          """)

          (kotlin_dir / "HaniMaakWidgetProvider.kt").write_text(r"""package com.hanimaak.hani_maak_mobile

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews

          class HaniMaakWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  appWidgetIds.forEach { updateOne(context, appWidgetManager, it) }
              }

              companion object {
                  private fun updateOne(
                      context: Context,
                      manager: AppWidgetManager,
                      widgetId: Int
                  ) {
                      val prefs = context.getSharedPreferences("hani_widget", Context.MODE_PRIVATE)
                      val views = RemoteViews(context.packageName, R.layout.hani_maak_widget)
                      views.setTextViewText(R.id.widget_patient, prefs.getString("patient_name", "Patient"))
                      views.setTextViewText(R.id.widget_medication, prefs.getString("next_medication", "No medication due"))
                      views.setTextViewText(R.id.widget_appointment, prefs.getString("next_appointment", "No upcoming appointment"))
                      val tasks = prefs.getInt("open_tasks", 0)
                      val status = prefs.getString("care_status", "Care plan up to date")
                      views.setTextViewText(R.id.widget_status, "$tasks open tasks · $status")

                      val launch = context.packageManager.getLaunchIntentForPackage(context.packageName)
                      if (launch != null) {
                          val pending = PendingIntent.getActivity(
                              context,
                              0,
                              launch,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, pending)
                      }
                      manager.updateAppWidget(widgetId, views)
                  }

                  fun refreshAll(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val component = ComponentName(context, HaniMaakWidgetProvider::class.java)
                      val ids = manager.getAppWidgetIds(component)
                      ids.forEach { updateOne(context, manager, it) }
                  }
              }
          }
          """)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              g = g.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
              g = g.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_11')
              gradle.write_text(g)
          PY

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release             --dart-define=HANI_API_BASE=https://hani-maak.vercel.app             --dart-define=SUPABASE_URL=https://lhrngmuxmjpigycgonnh.supabase.co             --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_8jxBjLqsE0-8fSxaCZqP7w_7LdAm4SI

      - name: Prepare final APK
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/Hani-Maak-Final-Stable.apk
          sha256sum dist/Hani-Maak-Final-Stable.apk > dist/Hani-Maak-Final-Stable.apk.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: hani-maak-final-stable-apk
          path: |
            dist/Hani-Maak-Final-Stable.apk
            dist/Hani-Maak-Final-Stable.apk.sha256
          retention-days: 30
          if-no-files-found: error
