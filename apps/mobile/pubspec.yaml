name: hani_maak_mobile
description: Hani Maak caregiver-first mobile MVP
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.1
  google_fonts: ^6.2.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  web: ^1.1.1
  record: ^6.2.1
  just_audio: ^0.10.5
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  home_widget: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/hani_app_icon.png
